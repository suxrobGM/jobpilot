# One release for host + plugin. Push a tag like `v2.1.0` (or run manually to re-sync): builds the AOT
# host per OS, mirrors provider-specific plugin payloads into the marketplaces, then publishes the
# terminal archives. Needs secret MARKETPLACE_PUSH_TOKEN (Contents:write on
# suxrobGM/claude-plugins and suxrobGM/codex-plugins).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish AOT
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish/
        working-directory: apps/terminal

      # The publish dir contains the native binary AND the bundled plugin/ tree,
      # so archive the whole directory, not just the binary.
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf jobpilot-terminal-${{ matrix.rid }}.tar.gz -C apps/terminal/publish .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path apps/terminal/publish/* -DestinationPath jobpilot-terminal-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jobpilot-terminal-${{ matrix.rid }}
          path: jobpilot-terminal-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download terminal artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Checkout Claude marketplace
        uses: actions/checkout@v7
        with:
          repository: suxrobGM/claude-plugins
          token: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
          path: marketplace

      - name: Checkout Codex marketplace
        uses: actions/checkout@v7
        with:
          repository: suxrobGM/codex-plugins
          token: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
          path: codex-marketplace

      # Both marketplaces get setup only; the terminal archives own runtime skills and MCP wiring.
      - name: Stage and verify marketplace payloads
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$(jq -er '.version' package.json)"
          fi
          bash .github/scripts/sync-marketplaces.sh . marketplace codex-marketplace

      - name: Commit marketplace updates
        run: |
          for dir in marketplace codex-marketplace; do
            git -C "$dir" config user.name "github-actions[bot]"
            git -C "$dir" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$dir" add -A
            git -C "$dir" diff --cached --quiet || git -C "$dir" commit -m "chore: sync jobpilot plugin ${GITHUB_REF_NAME}"
            git -C "$dir" push
          done

      # Publish the host only after its matching provider bootstraps are available.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*/jobpilot-terminal-*
          generate_release_notes: true
