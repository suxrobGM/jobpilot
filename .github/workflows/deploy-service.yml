# Build one image, push it to GHCR, and recreate only that service on the VPS.
# Called by deploy.yml. Secrets: SSH_HOST, SSH_USER, SSH_KEY, ENV_DOCKER. Vars: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_TERMINAL_URL.

name: Deploy service

on:
  workflow_call:
    inputs:
      service:
        description: Compose service and image name (api or web).
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # Relative to the SSH user's home, for both ssh and scp.
  APP_DIR: deploy/jobpilot

jobs:
  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ inputs.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/${{ inputs.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ inputs.service }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_TERMINAL_URL=${{ vars.NEXT_PUBLIC_TERMINAL_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ inputs.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ inputs.service }}:buildcache,mode=max

  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Write .env from ENV_DOCKER secret
        run: |
          mkdir -p deploy
          printf '%s\n' "${{ secrets.ENV_DOCKER }}" > deploy/.env
          # Lowercased owner/repo so the compose image refs resolve.
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY,,}" >> deploy/.env

      # Plain OpenSSH: appleboy actions download a release binary each run, which can 504.
      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Copy deploy files to VPS
        run: |
          ssh vps "mkdir -p $APP_DIR"
          scp deploy/docker-compose.yml deploy/.env deploy/jobpilot.conf "vps:$APP_DIR/"

      - name: Deploy with Docker Compose
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ inputs.service }}
        run: |
          ssh vps bash -s <<EOF
          set -e
          cd $APP_DIR
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose pull $SERVICE
          # --wait blocks until healthchecks (deploy/docker-compose.yml) pass and fails the deploy otherwise.
          docker compose up -d --no-deps --force-recreate --wait --wait-timeout 120 $SERVICE
          docker image prune -f
          docker compose ps --format "table {{.Name}}\t{{.Status}}"
          EOF
