name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run ci

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck API
        run: bun run typecheck
        working-directory: apps/api

      - name: Typegen web
        run: bun run typegen
        working-directory: apps/web

      - name: Typecheck web
        run: bun run typecheck
        working-directory: apps/web

      - name: Build web
        run: bun run build
        working-directory: apps/web

  terminal:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-terminal-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test terminal host
        run: dotnet test tests/JobPilot.Terminal.Tests -c Release

      # JIT reflection can hide missing JsonSerializable registrations, so publish one Native AOT RID.
      - name: Publish AOT (linux-x64)
        run: dotnet publish -c Release -r linux-x64 -o publish/
        working-directory: apps/terminal

      # InstallPaths.Resolve() requires these assets.
      - name: Verify publish root ships the plugin tree
        working-directory: apps/terminal/publish
        run: |
          for f in jobpilot \
                   plugin/.claude-plugin/plugin.json \
                   plugin/.codex-plugin/plugin.json \
                   plugin/skills/shared/setup.md \
                   plugin/skills/auto-apply/SKILL.md \
                   .agents/plugins/marketplace.json; do
            test -e "$f" || { echo "missing from publish root: $f"; exit 1; }
          done
