# JobPilot reverse proxy. Single origin: web at /, API proxied at /api.
# Install: copy to /etc/nginx/sites-available/jobpilot.conf, then `ln -s /etc/nginx/sites-available/jobpilot.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx`.
# TLS is added by `certbot --nginx -d jobpilot.suxrobgm.net`.
# Then make certbot's line read `listen 443 ssl http2;` (nginx 1.25.1+ wants a separate `http2 on;`):
# web and API share one origin and every SSE stream holds a connection, so HTTP/1.1's ~6 per origin runs out.

upstream jobpilot_api {
    server 127.0.0.1:4101;
}

upstream jobpilot_web {
    server 127.0.0.1:4100;
}

server {
    listen 80;
    server_name jobpilot.suxrobgm.net;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 25M;

    # API - the backend already mounts routes under /api, so the path is preserved.
    location /api/ {
        proxy_pass http://jobpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / EventSource: stream responses instead of buffering them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Next.js static assets - long-lived immutable cache.
    location /_next/static {
        proxy_pass http://jobpilot_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Web - everything else.
    location / {
        proxy_pass http://jobpilot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
